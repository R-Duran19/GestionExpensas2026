version: '3.8'

services:
  # Contenedor de la aplicación Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion_expensas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage/app/public:/var/www/html/public/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-expensas_db}
      - DB_USERNAME=${DB_USERNAME:-expensas_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - RUN_SEEDERS=${RUN_SEEDERS:-false}
    networks:
      - geopricer_365soft_app-network
      - expensas_network
    depends_on:
      - mysql
    ports:
      - "${APP_PORT:-8001}:80"  # Puerto para acceso directo al contenedor
    expose:
      - "80"
      - "9000"

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: gestion_expensas_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-expensas_db}
      MYSQL_USER: ${DB_USERNAME:-expensas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    ports:
      - "${DB_PORT:-3307}:3306"  # 3307 en el host para evitar conflictos con MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - expensas_network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

networks:
  # Conexión a la red externa del nginx-proxy-manager
  geopricer_365soft_app-network:
    external: true
    name: geopricer_365soft_app-network

  # Red interna para la comunicación entre servicios
  expensas_network:
    driver: bridge
    name: gestion_expensas_network

volumes:
  mysql_data:
    driver: local
    name: gestion_expensas_mysql_data