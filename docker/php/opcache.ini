; OPcache — speedup global 5-15% (backlog 05-pendiente)
; La imagen es BAKED (código dentro de la imagen), por eso validate_timestamps=0
; es seguro: cada deploy regenera el contenedor con código nuevo.
; Si se monta el código como volumen en desarrollo, NO aplicar este archivo.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=128M
