; =============================================================================
; zz-expensas.conf — Pool PHP-FPM dimensionado para VPS 4GB RAM
; Plan 12 Fase 0.3 | Gestion de Expensas 2026
; =============================================================================
; Se copia a /usr/local/etc/php-fpm.d/zz-expensas.conf. Al cargarse en orden
; alfabetico DESPUES de www.conf y zz-docker.conf, estos valores ganan.
;
; Calculo (4GB total, ~40% reservado para MySQL + sistema + nginx):
;   4GB x 0.6 = 2.4GB disponibles / ~70MB promedio por request Livewire
;   => 35 children max (~2.4GB en peor caso realista).
;   150 usuarios "activos" = 10-30 requests concurrentes (picos dia de boleta).
; pm.max_requests=500 recicla workers y mitiga fugas de memoria.
; =============================================================================

[www]

pm = dynamic
pm.max_children = 35
pm.start_servers = 8
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 500
pm.process_idle_timeout = 30s

; Log de requests lentas (>5s) para detectar queries/reportes pesados
slowlog = /var/log/supervisor/php-fpm-slow.log
request_slowlog_timeout = 5s
