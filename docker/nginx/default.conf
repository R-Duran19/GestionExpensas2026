server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    # Permite subir archivos grandes (imágenes, PDFs) sin error 413.
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;  # ✅ CORRECTO - conexión local directa
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Assets de Livewire se sirven dinámicamente vía Laravel (no como archivos físicos).
    # Esta location ^~ tiene prioridad sobre la regex de estáticos de abajo, evitando
    # el 404 de /livewire/livewire.min.js en producción con nginx.
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Optimización para archivos estáticos
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Configuración para el storage link
    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }
}